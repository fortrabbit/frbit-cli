version: 2

project_name: frbit

before:
  hooks:
    - go mod tidy

builds:
  - id: frbit
    main: ./cmd/frbit
    binary: frbit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: default
    ids:
      - frbit
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
    disable: false

release:
  name_template: "{{ .ProjectName }} {{ .Version }}"
  draft: false
  prerelease: auto

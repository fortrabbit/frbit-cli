version: 2

project_name: frbit

before:
  hooks:
    - go mod tidy

builds:
  - id: frbit
    main: ./cmd/frbit
    binary: frbit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: default
    ids:
      - frbit
    # These names are a public API used by the installer and package managers.
    name_template: "{{ .ProjectName }}_{{ if eq .Os \"darwin\" }}macOS_{{ if eq .Arch \"arm64\" }}AppleSilicon{{ else }}Intel{{ end }}{{ else }}{{ .Os }}_{{ .Arch }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
    disable: false

brews:
  - name: frbit
    ids:
      - default
    directory: Formula
    homepage: https://github.com/fortrabbit/frbit-cli
    description: Command-line interface for the fortrabbit public API
    license: MIT
    test: |
      system "#{bin}/frbit", "version"
    repository:
      owner: fortrabbit
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: fortrabbit release bot
      email: support@fortrabbit.com

release:
  name_template: "{{ .ProjectName }} {{ .Version }}"
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./install.sh

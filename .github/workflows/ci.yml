name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run static analysis
        run: go vet ./...
      - name: Run tests
        run: go test -race ./...
      - name: Test install script
        run: sh scripts/test-install.sh
      - name: Build binary
        run: go build ./cmd/frbit

  release-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          # `goreleaser check` rejects the intentionally retained deprecated
          # `brews` pipe. A snapshot validates and exercises the full config.
          args: release --snapshot --clean --skip=publish,sbom
      - name: Check npm release scripts
        run: |
          node --check npm/bin/frbit.js
          node --check npm/scripts/prepare-release.mjs
          node --check npm/scripts/publish-release.mjs
          node --check npm/scripts/smoke-test.mjs
      - name: Build npm packages from release binaries
        run: node npm/scripts/prepare-release.mjs 0.0.0-ci
      - name: Smoke-test npm launcher
        run: node npm/scripts/smoke-test.mjs
      - name: Check npm package contents
        run: node npm/scripts/publish-release.mjs --dry-run
